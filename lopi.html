<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lopu uzskaite</title>
<style>
:root{--bg:#eef0e6;--sf:#fbfbf6;--tx:#23291c;--mu:#6b7260;--ln:#d5d9c8;--ac:#3f6b2a;--ac2:#e8f0dc;--wa:#b4501c;--wb:#fbe9dc}
@media (prefers-color-scheme:dark){:root{--bg:#171a13;--sf:#21251b;--tx:#e9ecdf;--mu:#9aa28b;--ln:#363c2b;--ac:#8fc46a;--ac2:#2c3a21;--wa:#f0a070;--wb:#43281a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
header{padding:14px 14px 8px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--ln)}
h1{font-size:1.15rem;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px;width:100%}
button{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.d{color:var(--wa)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#q{font-size:1.3rem;letter-spacing:.05em}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chip{white-space:nowrap;border-radius:99px;padding:6px 12px;font-size:.9rem}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip.wc.on{background:var(--wa);border-color:var(--wa)}
main{padding:10px 14px 80px;max-width:720px;margin:auto}
.cnt{color:var(--mu);font-size:.85rem;margin:4px 0 8px}
.row{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;width:100%;text-align:left}
.num{font-size:1.7rem;font-weight:700;min-width:3.6ch;font-variant-numeric:tabular-nums}
.pre{display:block;font-size:.75rem;color:var(--mu);font-weight:400}
.meta{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.b{font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.b.w{background:var(--wb);color:var(--wa)}
.kg{color:var(--mu);font-size:.9rem;white-space:nowrap}
dialog{border:0;border-radius:14px;padding:0;background:var(--bg);color:var(--tx);width:min(560px,96vw);max-height:92vh}
dialog::backdrop{background:#0008}
.in{padding:16px}
.in h2{margin:0;font-size:2rem}
.fl{display:grid;gap:10px;margin:12px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:1rem}
.big{font-size:1.5rem;font-weight:700;color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:5px 4px;border-bottom:1px solid var(--ln);text-align:left}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
</style>
</head>
<body>
<header>
  <h1>Lopu uzskaite <span><button id="add">+ Pievienot</button> <button id="menu">⋮</button></span></h1>
  <input id="q" type="search" inputmode="numeric" placeholder="Pēdējie cipari, piem. 427" aria-label="Meklēt pēc numura">
  <div class="chips" id="chips"></div>
</header>
<main><div class="cnt" id="cnt"></div><div id="list"></div></main>

<dialog id="dlg"><div class="in" id="det"></div></dialog>

<dialog id="mdlg"><div class="in">
  <h3>Dati</h3>
  <div class="card"><b>Ielādēt CSV (lopu saraksts)</b>
    <p style="margin:6px 0;color:var(--mu);font-size:.88rem">Pirmā kolonna – numurs. Ja ir virsraksti, tiks atpazīta arī kategorija un teļošanās (piem. «veids», «teļojusies»). Esošie numuri netiek dzēsti.</p>
    <select id="defc"><option value="cits">Kategorija pēc noklusējuma: nenoteikta</option><option value="tele">Kategorija pēc noklusējuma: teļš</option><option value="govs">Kategorija pēc noklusējuma: govs</option></select>
    <div class="bar"><input type="file" id="csv" accept=".csv,.txt,text/csv"></div>
  </div>
  <div class="card"><b>Rezerves kopija</b>
    <p style="margin:6px 0;color:var(--mu);font-size:.88rem">Dati glabājas šajā ierīcē un pārlūkā. Regulāri saglabā kopiju, lai nepazustu.</p>
    <div class="bar"><button id="exp">Lejupielādēt kopiju</button><button id="impb">Ielādēt kopiju</button><input type="file" id="imp" accept=".json" hidden></div>
  </div>
  <div class="bar"><button id="mclose" class="p">Aizvērt</button></div>
</div></dialog>

<script>
const $=s=>document.querySelector(s);
const KEY='lopi_v1';
let A=[];try{A=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
let F='all',cur=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){alert('Neizdevās saglabāt datus pārlūkā.')}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const needTag=a=>/jaun/i.test(a.note||'')&&/krot/i.test(a.note||'');
const sw=a=>[...(a.w||[])].sort((x,y)=>x.d<y.d?-1:1);
const fmt=n=>n.toLocaleString('lv-LV',{maximumFractionDigits:2});
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
function adg(a){const w=sw(a);if(w.length<2)return null;
  const f=w[0],l=w[w.length-1],p=w[w.length-2];
  const dt=days(f.d,l.d),dl=days(p.d,l.d);
  return{tot:dt>0?(l.kg-f.kg)/dt:null,dt,last:dl>0?(l.kg-p.kg)/dl:null,dl,diff:l.kg-f.kg}}
const CATN={tele:'Teļš',govs:'Govs',cits:'Nenoteikts'};
const FL=[['all','Visi'],['tele','Teļi'],['govs','Govis'],['govsK','Govis – bijis teļš'],['govsN','Govis – nav bijis teļš'],['tag','Jauna krotālija']];
const test={all:()=>1,tele:a=>a.c==='tele',govs:a=>a.c==='govs',govsK:a=>a.c==='govs'&&a.k===true,govsN:a=>a.c==='govs'&&a.k!==true,tag:needTag};

function render(){
  $('#chips').innerHTML=FL.map(([k,t])=>`<button class="chip ${k==='tag'?'wc':''} ${F===k?'on':''}" data-f="${k}">${t} (${A.filter(test[k]).length})</button>`).join('');
  const q=$('#q').value.replace(/\D/g,'');
  let L=A.filter(test[F]);
  if(q)L=L.filter(a=>a.n.includes(q)).sort((x,y)=>(y.n.endsWith(q))-(x.n.endsWith(q)));
  else L.sort((x,y)=>x.n.slice(-3).localeCompare(y.n.slice(-3))||x.n.localeCompare(y.n));
  $('#cnt').textContent=`Rāda ${L.length} no ${A.length}`;
  $('#list').innerHTML=L.length?L.map(a=>{
    const w=sw(a),lw=w[w.length-1];
    return `<button class="row" data-n="${esc(a.n)}"><span class="num"><span class="pre">${esc(a.n.slice(0,-3))}</span>${esc(a.n.slice(-3))}</span>
    <span class="meta"><span class="b">${CATN[a.c]}</span>${a.c==='govs'?`<span class="b">${a.k===true?'bijis teļš':a.k===false?'nav bijis teļš':'teļš nezināms'}</span>`:''}${needTag(a)?'<span class="b w">jauna krotālija</span>':''}</span>
    <span class="kg">${lw?fmt(lw.kg)+' kg':''}</span></button>`}).join(''):
    `<div class="empty">${A.length?'Nekas netika atrasts.':'Saraksts ir tukšs. Spied ⋮ un ielādē CSV failu vai pievieno lopu ar «+ Pievienot».'}</div>`;
}

function open_(n){cur=A.find(a=>a.n===n);if(!cur)return;detail();$('#dlg').showModal()}
function detail(){
  const a=cur,g=adg(a),w=sw(a);
  $('#det').innerHTML=`
  <h2><span class="pre" style="display:inline;font-size:1rem">${esc(a.n.slice(0,-3))}</span>${esc(a.n.slice(-3))}</h2>
  <div class="fl"><div class="g2">
    <label>Kategorija<select id="fc"><option value="cits">Nenoteikts</option><option value="tele">Teļš</option><option value="govs">Govs</option></select></label>
    ${a.c==='govs'?`<label>Vai bijis teļš?<select id="fk"><option value="">Nezināms</option><option value="y">Jā, ir bijis</option><option value="n">Nav bijis</option></select></label>`:'<span></span>'}
  </div></div>
  <div class="card"><h3>Svars</h3>
    <div class="g2"><input type="date" id="wd" value="${today()}" aria-label="Datums"><input type="number" id="wk" inputmode="decimal" step="0.1" min="0" placeholder="kg" aria-label="Svars kg"></div>
    <div class="bar"><button class="p" id="wadd">Saglabāt svaru</button></div>
    ${g?`<p style="margin:12px 0 0">Pieaugums dienā${g.tot!==null?` (kopš ${esc(w[0].d)}, ${g.dt} d.)`:''}</p>
      <div class="big">${g.tot!==null?fmt(g.tot*1000)+' g/dienā':'—'}</div>
      <div style="color:var(--mu);font-size:.9rem">${g.last!==null?`Pēdējā periodā (${g.dl} d.): ${fmt(g.last*1000)} g/dienā · `:''}kopā ${g.diff>0?'+':''}${fmt(g.diff)} kg</div>`:
      `<p style="color:var(--mu);margin:10px 0 0;font-size:.9rem">Lai redzētu pieaugumu, vajag vismaz divus svēršanas datumus.</p>`}
    ${w.length?`<table style="margin-top:10px"><tr><th>Datums</th><th>kg</th><th></th></tr>${[...w].reverse().map(x=>`<tr><td>${esc(x.d)}</td><td>${fmt(x.kg)}</td><td><button class="d" data-wd="${esc(x.d)}|${x.kg}" aria-label="Dzēst">✕</button></td></tr>`).join('')}</table>`:''}
  </div>
  <div class="card"><h3>Piezīmes</h3>
    <textarea id="nt" rows="4" placeholder="Piem. vajag jaunu krotāliju">${esc(a.note||'')}</textarea>
    <div id="tg" style="margin-top:6px">${needTag(a)?'<span class="b w">Atzīmēts: jauna krotālija</span>':''}</div>
    <div style="color:var(--mu);font-size:.8rem;margin-top:6px">Ja piezīmēs ir vārdi «jauna» un «krotālija», lops parādās filtrā «Jauna krotālija».</div>
  </div>
  <div class="bar" style="justify-content:space-between"><button class="d" id="del">Dzēst lopu</button><button class="p" id="cl">Gatavs</button></div>`;
  $('#fc').value=a.c;
  if($('#fk'))$('#fk').value=a.k===true?'y':a.k===false?'n':'';
}

$('#det').addEventListener('change',e=>{
  if(e.target.id==='fc'){cur.c=e.target.value;if(cur.c!=='govs')cur.k=null;save();detail()}
  if(e.target.id==='fk'){cur.k=e.target.value==='y'?true:e.target.value==='n'?false:null;save()}
});
$('#det').addEventListener('input',e=>{
  if(e.target.id==='nt'){cur.note=e.target.value;save();$('#tg').innerHTML=needTag(cur)?'<span class="b w">Atzīmēts: jauna krotālija</span>':''}
});
$('#det').addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='wadd'){const kg=parseFloat($('#wk').value.replace(',','.')),d=$('#wd').value;
    if(!d||!(kg>0)){alert('Ieraksti datumu un svaru.');return}
    cur.w=(cur.w||[]).filter(x=>x.d!==d);cur.w.push({d,kg});save();detail()}
  if(t.dataset.wd){const[d,k]=t.dataset.wd.split('|');cur.w=cur.w.filter(x=>!(x.d===d&&String(x.kg)===k));save();detail()}
  if(t.id==='del'&&confirm('Dzēst lopu '+cur.n+'?')){A=A.filter(a=>a!==cur);save();$('#dlg').close()}
  if(t.id==='cl')$('#dlg').close();
});
$('#dlg').addEventListener('close',render);
$('#list').addEventListener('click',e=>{const r=e.target.closest('.row');if(r)open_(r.dataset.n)});
$('#chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){F=c.dataset.f;render()}});
$('#q').addEventListener('input',render);
$('#add').onclick=()=>{
  const n=(prompt('Lopa numurs:')||'').trim();if(!n)return;
  if(A.some(a=>a.n===n)){open_(n);return}
  A.push({n,c:'cits',k:null,w:[],note:''});save();render();open_(n)};
$('#menu').onclick=()=>$('#mdlg').showModal();
$('#mclose').onclick=()=>$('#mdlg').close();

// CSV
function parseCSV(t){
  const lines=t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return[];
  const f=lines[0],del=[';','\t',','].map(d=>[d,f.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=lines.map(l=>l.split(del).map(c=>c.trim().replace(/^"|"$/g,'')));
  let ci=0,cc=-1,ck=-1;
  if(!/\d/.test(rows[0][0])){
    const h=rows.shift().map(x=>x.toLowerCase());
    const i=h.findIndex(x=>/nr|numur|krot|id/.test(x));if(i>=0)ci=i;
    cc=h.findIndex(x=>/veids|kategor|tips|dzimum/.test(x));
    ck=h.findIndex(x=>/teļ|telj|teļoj|teloj/.test(x)&&!/veids|kategor|tips/.test(x));
  }
  return rows.map(r=>({n:(r[ci]||'').replace(/\s+/g,''),c:cc>=0?r[cc]:'',k:ck>=0?r[ck]:''})).filter(r=>r.n);
}
$('#csv').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  const rows=parseCSV(await file.text());let add=0,upd=0;
  const dc=$('#defc').value;
  rows.forEach(r=>{
    let c=/govs|govi|cow/i.test(r.c)?'govs':/teļ|tel|calf/i.test(r.c)?'tele':'';
    let k=r.k===''?undefined:/^(jā|ja|yes|y|1|true|x|\+)/i.test(r.k)?true:false;
    let a=A.find(x=>x.n===r.n);
    if(a){if(c)a.c=c;if(k!==undefined&&a.c==='govs')a.k=k;upd++}
    else{a={n:r.n,c:c||dc,k:null,w:[],note:''};if(k!==undefined&&a.c==='govs')a.k=k;A.push(a);add++}
  });
  save();render();e.target.value='';alert(`Pievienoti: ${add}, atjaunināti: ${upd}`);$('#mdlg').close();
});
// JSON backup
$('#exp').onclick=()=>{const b=new Blob([JSON.stringify(A,null,1)],{type:'application/json'});
  const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='lopi-'+today()+'.json';l.click();URL.revokeObjectURL(u)};
$('#impb').onclick=()=>$('#imp').click();
$('#imp').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d))throw 0;
    if(confirm('Aizvietot visus pašreizējos datus ar kopiju ('+d.length+' lopi)?')){A=d;save();render();$('#mdlg').close()}}
  catch(x){alert('Fails nav derīga kopija.')}
  e.target.value='';
});
render();
</script>
</body>
</html>
